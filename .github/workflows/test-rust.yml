name: Test Rust

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup vcpkg libxml Cache
        if: contains(matrix.os, 'windows')
        uses: actions/cache@v3
        id: vcpkg-cache
        with:
          path: C:\vcpkg
          key: vcpkg-libxml2

      - name: Setup Environment (Act)
        if: ${{ env.ACT }}
        run: . .github/setup-act.sh

      - name: Setup Environment (Windows)
        if: contains(matrix.os, 'windows')
        run: . .github/setup-windows.ps1

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Clippy
        run: cargo clippy --all-targets --verbose
