name: Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        if: ${{ env.ACT }}
        run: . .github/workflows/act_setup.sh

      - name: UV setup
        uses: astral-sh/setup-uv@v6
        with:
          python-version: 3.12
          activate-environment: "true"

      - name: Install llvm cov
        run: cargo install cargo-llvm-cov

      - name: Run tests
        run: cargo llvm-cov --codecov --output-path cov.json

      - name: Install PyXmlGenerator
        run: |
          cargo llvm-cov show-env --sh > llvm-cov-env.sh
          source llvm-cov-env.sh
          uv sync --all-packages --all-groups

      - name: Run pytest with coverage
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: |
            cargo llvm-cov show-env --sh > llvm-cov-env.sh
            source llvm-cov-env.sh
            uv run pytest --cov --cov-report=xml

      - name: Upload to codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cov.json,./coverage.xml
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
