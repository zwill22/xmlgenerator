name: Test Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Environment
        if: ${{ env.ACT }}
        run: . .github/workflows/act_setup.sh

      - name: Set up Rust
        run: rustup show

      - name: UV setup
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Install Dependencies
        run: |
          uv sync --all-packages --all-groups

      - name: Lint with Ruff
        run: uv run ruff check

      - name: Run tests
        uses: nick-fields/retry@v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 5
          command: uv run pytest -v

