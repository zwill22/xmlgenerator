name: Test Python

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

defaults:
  run:
    shell: bash
    working-directory: py_xml_generator

jobs:
  test-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Rust
        if: ${{ env.ACT }}
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Set up Rust
        run: rustup show

      - name: Setup clang
        if: ${{ env.ACT }}
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: clang-latest

      - name: Setup cmake
        if: ${{ env.ACT }}
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: "3.22"

      - name: UV setup
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"

      - name: Install Dependencies
        run: |
          uv sync --all-packages --all-extras

      - name: Run tests
        run: uv run pytest -v
