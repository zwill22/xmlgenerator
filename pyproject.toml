[project]
name = "xmlgenerator"
version = "0.2.1"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["pyxmlgenerator", "pyxsdtestdata"]

[tool.uv.sources]
xmlgenerator = { workspace = true }
pyxsdtestdata = { workspace = true }

[tool.uv.workspace]
members = ["py_xml_generator", "py_xsd_test_data"]

[dependency-groups]
doc = ["sphinx", "sphinx-rtd-theme", "myst-parser", "sphinxcontrib-rust"]
dev = ["maturin", "pytest", "pytest-cov", "ruff"]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.maturin]
features = ["pyo3/extension-module"]
