[package]
name = "xmlgenerator"
version = "0.1.0"
edition = "2024"

[dependencies]
xsdvalidator = { workspace = true }
regextranslator = { workspace = true }
xsd-parser = "1.3.0"
xml-builder = "0.5.4"
fake = { version = "4.4.0", features = ["derive", "chrono", "time", "http", "base64"] }
rand = "0.9.2"
rand_regex = "0.18.1"
rand_xorshift = "0.4.0"
uuid = { version = "1.18.0", features = ["v4"] }
gag = "1.0.0"
regex = "1.11.1"
const_format = "0.2.35"
chrono = "0.4.42"
http = "1.3.1"
line-ending = "1.5.1"
regex-intersect = "1.2.0"
quick-xml = "0.38.4"

[dev-dependencies]
workspace_root = "0.2.0"
xsdtestdata = { workspace = true }
rstest = "0.26.1"
